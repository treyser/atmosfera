<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мапа світу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
</head>
<body class="crew">
  <div class="atlas">
    <header>
      <div class="brand">
        <div class="eyebrow">Прокляття Неболіусу</div>
        <h1>Незвідані води</h1>
      </div>
      <div class="lead">Обери знак питання й запропонуй команді курс. Майстер бачить усі пропозиції.</div>
      <div class="seen" id="seen"></div>
      <button type="button" class="close" id="close" title="Закрити (Esc)">✕</button>
    </header>

    <main>
      <div class="sea" id="sea">
        <div class="frame" id="frame">
          <img alt="Мапа світу" id="map" draggable="false">
          <div class="dots" id="dots"></div>
        </div>
      </div>

      <aside>
        <div class="pick" id="pick">
          <div class="compass">✦</div>
          <p>Куди пливемо далі?</p>
          <p class="dim">Натисни на будь-який знак питання. Що там чекає — дізнаєтесь, коли допливете.</p>
        </div>

        <div class="info" id="info" hidden>
          <div class="meta"><span id="region"></span></div>
          <h2><span class="no">№</span><span id="no"></span></h2>
          <div class="tag" id="state"></div>
          <div class="actions solo">
            <button type="button" class="go" id="vote">Пропоную плисти сюди</button>
          </div>
        </div>

        <section class="votes">
          <h3>Пропозиції команди</h3>
          <div id="votes"></div>
        </section>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/map.js"></script>
</body>
</html>
