<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крамниця</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
</head>
<body class="shop">
  <!-- Майстер: керування -->
  <header class="gmbar" id="gmbar" hidden>
    <select id="pick" title="Яку крамницю показати"></select>
    <button type="button" class="ghost" id="add" title="Нова крамниця">＋</button>
    <button type="button" class="ghost" id="dup" title="Дублювати">⧉</button>
    <button type="button" class="ghost danger" id="del" title="Видалити крамницю">🗑</button>
    <nav class="mtabs" id="mtabs">
      <button type="button" data-m="view" class="on">Вітрина</button>
      <button type="button" data-m="edit">Редагувати</button>
      <button type="button" data-m="offers">Пропозиції <b id="ocount" hidden></b></button>
    </nav>
    <select id="disc" title="Знижка чи надбавка для гравців">
      <option value="0.2">−20% (дуже вмовили)</option>
      <option value="0.1">−10% (вмовили)</option>
      <option value="0" selected>звичайні ціни</option>
      <option value="-0.1">+10% (образили)</option>
      <option value="-0.2">+20%</option>
    </select>
    <button type="button" class="go" id="open">Відкрити для гравців</button>
    <button type="button" class="close" id="close" title="Закрити (Esc)">✕</button>
  </header>

  <!-- Вітрина (бачать усі) -->
  <main class="store" id="store">
    <aside class="keeper">
      <button type="button" class="close pclose" id="pclose" title="Закрити (Esc)">✕</button>
      <div class="portrait" id="portrait"><span id="initial"></span></div>
      <div class="sname" id="sname"></div>
      <div class="sowner" id="sowner"></div>
      <p class="greet" id="greet"></p>
      <p class="about" id="about"></p>
      <div class="purse" id="purse-box">
        <div class="plbl">Твій гаманець</div>
        <div class="coins" id="purse"></div>
        <div class="dim" id="purse-hint"></div>
      </div>
      <button type="button" class="ghost wide" id="sell">Запропонувати щось на продаж</button>
      <div class="sellbox" id="sellbox" hidden>
        <select id="sell-item"></select>
        <div class="srow"><input type="number" id="sell-ask" min="0" step="1" placeholder="Скільки хочеш, зм"><button type="button" class="go" id="sell-go">Запропонувати</button></div>
        <div class="dim" id="sell-hint"></div>
      </div>
      <div class="disc" id="disc-note" hidden></div>
    </aside>
    <section class="wares">
      <nav class="cats" id="cats"></nav>
      <div class="grid" id="grid"></div>
      <div class="closed" id="closed" hidden>Крамниця зачинена. Зазирніть, коли майстер її відкриє.</div>
    </section>
    <section class="detail" id="detail" hidden>
      <div class="dimg" id="dimg"></div>
      <div class="dname" id="dname"></div>
      <div class="drar" id="drar"></div>
      <p class="ddesc" id="ddesc"></p>
      <p class="dmech" id="dmech"></p>
      <p class="dquote" id="dquote"></p>
      <div class="dbuy">
        <div class="dprice" id="dprice"></div>
        <button type="button" class="go" id="buy">Купити</button>
      </div>
      <div class="dim" id="buy-hint"></div>
    </section>
  </main>

  <!-- Майстер: редактор -->
  <main class="editor" id="editor" hidden>
    <div class="efields">
      <label>Назва крамниці<input id="e-name" maxlength="60"></label>
      <label>Хто торгує<input id="e-owner" maxlength="40"></label>
      <label class="wide">Привітання (що каже торговець)<input id="e-greet" maxlength="200"></label>
      <label class="wide">Опис крамниці<textarea id="e-about" rows="2" maxlength="400"></textarea></label>
      <label class="wide">Портрет торговця (посилання на зображення)
        <span class="imgrow"><input id="e-img" placeholder="https://…"><button type="button" class="ghost" id="e-img-sel" title="Виділи на мапі токен або картинку — і натисни">З виділеного на мапі</button></span></label>
      <label class="wide">Тло вітрини (інтер'єр крамниці)
        <span class="imgrow"><input id="e-bg" placeholder="https://…"><button type="button" class="ghost" id="e-bg-sel">З виділеного на мапі</button></span></label>
      <label>Купує речі гравців за<select id="e-buy"><option value="0.25">¼ ціни</option><option value="0.5">½ ціни</option><option value="0.75">¾ ціни</option><option value="1">повну ціну</option></select></label>
    </div>
    <div class="ehead"><b>Товари</b><span class="dim">Кількість порожня — товару безліч. «Лише обмін» гравці бачать, але купити не можуть.</span><button type="button" class="go" id="e-add">＋ Товар</button></div>
    <div class="items" id="e-items"></div>
    <div class="io">
      <button type="button" class="ghost" id="export">Скопіювати всі крамниці</button>
      <button type="button" class="ghost" id="import">Вставити з тексту</button>
      <span class="dim">Крамниці живуть у браузері майстра — так їх можна зберегти або перенести на інший комп'ютер.</span>
      <textarea id="io-text" rows="3" hidden spellcheck="false"></textarea>
    </div>
  </main>

  <!-- Майстер: що гравці пропонують продати -->
  <main class="offers" id="offers" hidden>
    <div class="olist" id="olist"></div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/src/shop.js"></script>
</body>
</html>
