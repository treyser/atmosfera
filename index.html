<!DOCTYPE html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Атмосфера</title></head>
<body>
  <div class="head"><div class="title">Атмосфера</div><div class="detail" id="now"></div></div>

  <div id="player" class="empty" hidden>Атмосферою керує майстер</div>

  <div id="gm" hidden>
    <span class="lbl">Режисер</span>
    <div class="steps">
      <button type="button" id="prev" title="Попередній момент">◀ Назад</button>
      <button type="button" id="next" title="Наступний момент">Далі ▶</button>
    </div>
    <div class="beats" id="beats"></div>
    <div class="hint" id="found"></div>

    <span class="lbl">Настрій сцени</span>
    <div class="grid" id="presets"></div>

    <label class="check"><input type="checkbox" id="grade"> Кольорокорекція картинки</label>
    <div class="hint">Міняє кольори самої мапи під настрій і додає спалахи блискавок на ній. Якщо картинка поводиться дивно — вимкни.</div>

    <span class="lbl">Тонке налаштування</span>
    <div class="sliders" id="sliders"></div>

    <span class="lbl">Титр для всіх</span>
    <input type="text" id="big" placeholder="Тихе море" maxlength="60">
    <input type="text" id="small" placeholder="День дванадцятий плавання" maxlength="90">
    <div class="foot"><button type="button" id="show">Показати титр</button></div>
    <div class="hint">Титр зʼявляється в усіх на кілька секунд і зникає сам.</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
